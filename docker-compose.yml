services:
  habits:
    build:
      context: .
      dockerfile: Dockerfile
    image: habits-app:local
    container_name: habits-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: file:/app/data/habits.db
      JWT_SECRET: change-me-before-running-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:4000,http://127.0.0.1:4000
      # SKIP_PRISMA_PUSH: 1   # uncomment to skip auto-apply schema on start
    volumes:
      - habits-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); http.get('http://localhost:4000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  habits-data:
